services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/data/app.db
      Keycloak__Authority: http://keycloak:8080/realms/user-directory
      Keycloak__Issuer: http://localhost:8082/realms/user-directory
      Keycloak__Audience: user-directory-api
      Keycloak__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - user-directory-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: http://localhost:8080
        VITE_KEYCLOAK_URL: http://localhost:8082
        VITE_KEYCLOAK_REALM: user-directory
        VITE_KEYCLOAK_CLIENT_ID: user-directory-frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  user-directory-data:
